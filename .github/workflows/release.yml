name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"

jobs:
  build:
    # Signing inputs hoisted to env: the `secrets` context is not
    # available in step `if` conditions, and env values stay masked.
    env:
      WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    strategy:
      # Each OS packages differently; one platform's failure must not
      # hide the others'.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: msi
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Failed runs must still cache: each release retry otherwise
          # recompiles everything from scratch.
          cache-on-failure: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev perl
      - name: Windows perl (SQLCipher native build)
        if: matrix.os == 'windows-latest'
        run: choco install strawberryperl -y --no-progress
      - name: Prefer Strawberry Perl on PATH
        # Git Bash prepends its own MSYS2 perl, which lacks core modules
        # OpenSSL's Configure needs. Out-File UTF-8: pwsh >> writes UTF-16
        # and would poison GITHUB_PATH.
        if: matrix.os == 'windows-latest'
        run: "C:/Strawberry/perl/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      # RUSTFLAGS must be exported from a run step: `env:` values are
      # literal (no $VAR expansion), so rustc would receive them unexpanded.
      - name: Set reproducible flags
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix $GITHUB_WORKSPACE=/ferrite --remap-path-prefix $HOME/.cargo=/cargo" >> $GITHUB_ENV
      # SQLCipher features are mandatory in release: the per-crate
      # build.rs gates fail closed without them (docs/STORAGE_CONTRACT.md).
      - name: Build Rust --locked reproducible
        run: cargo build --locked --release --target ${{ matrix.target }} --features ferrite-vault/sqlcipher,ferrite-archive/sqlcipher
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
      - name: Build Go relay
        run: go build -ldflags="-s -w" -o ferrite-relay${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./...
        working-directory: relay
      - name: Package Linux deb
        if: matrix.pkg == 'deb'
        run: cargo install --locked cargo-bundle@0.12.0 && cargo bundle -p ferrite-browser --release --target ${{ matrix.target }} --format deb --binary-path target/${{ matrix.target }}/release/ferrite
      - name: WiX Toolset (MSI packaging)
        if: matrix.pkg == 'msi'
        run: choco install wixtoolset -y --no-progress
      - name: Package Windows msi
        if: matrix.pkg == 'msi'
        run: cargo install --locked cargo-wix@0.3.9 && cargo wix -p ferrite-browser --target ${{ matrix.target }} --nocapture --no-build --target-bin-dir target/${{ matrix.target }}/release
      - name: Package macOS dmg
        if: matrix.pkg == 'dmg'
        run: cargo install --locked cargo-bundle@0.12.0 && cargo bundle -p ferrite-browser --release --target ${{ matrix.target }} --format dmg --binary-path target/${{ matrix.target }}/release/ferrite
      - name: Sign Windows Authenticode
        if: matrix.os == 'windows-latest' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT))
          & signtool sign /fd SHA256 /a /f $pfx /p $env:WINDOWS_CERT_PASSWORD (Get-ChildItem target/${{ matrix.target }}/release/*.msi).FullName
          & signtool sign /fd SHA256 /a /f $pfx /p $env:WINDOWS_CERT_PASSWORD (Get-ChildItem target/${{ matrix.target }}/release/ferrite*.exe).FullName
          Remove-Item $pfx -Force
      - name: Warn when Windows signing skipped
        if: matrix.os == 'windows-latest' && env.WINDOWS_SIGNING_CERT == ''
        run: 'echo "::warning::No Windows signing cert configured: MSI ships unsigned (SmartScreen will flag it)"'
      - name: Sign & Notarize macOS
        if: matrix.os == 'macos-latest' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --deep --force --verify --verbose --sign "Developer ID Application: Ferrite Browser" target/${{ matrix.target }}/release/bundle/macos/*.app
          ditto -c -k --keepParent target/${{ matrix.target }}/release/bundle/macos/Ferrite.app Ferrite-${{ matrix.target }}.dmg
          xcrun notarytool submit Ferrite-${{ matrix.target }}.dmg --apple-id $APPLE_ID --password $APPLE_PASSWORD --team-id $APPLE_TEAM_ID --wait
          xcrun stapler staple Ferrite-${{ matrix.target }}.dmg
      - name: Warn when macOS signing skipped
        if: matrix.os == 'macos-latest' && env.APPLE_ID == ''
        run: 'echo "::warning::No Apple credentials configured: DMG ships unsigned and unnotarized (Gatekeeper will block it)"'
      - name: SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          # nullglob: an unmatched pattern must vanish, not reach sha256sum
          # as a literal string. Never redirect this command's stderr away.
          shopt -s nullglob
          files=(target/${{ matrix.target }}/release/ferrite*)
          # Files only: the bundler leaves a staging directory beside the
          # .deb, and sha256sum dies on directories.
          for d in target/${{ matrix.target }}/release/bundle target/wix; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do files+=("$f"); done < <(find "$d" -type f | sort)
          done
          ((${#files[@]})) || { echo "no artifacts to hash"; exit 1; }
          sha256sum "${files[@]}" | tee SHA256SUMS-${{ matrix.target }}.txt
      - name: Channel tarball (per-target update artifact)
        shell: bash
        run: |
          set -euo pipefail
          # The updater resolves one artifact per target triple and fails
          # closed on a missing triple. Tarballs carry the binary only.
          bin="target/${{ matrix.target }}/release/ferrite"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          test -f "$bin" || { echo "missing binary: $bin"; exit 1; }
          tar czf "ferrite-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          sha256sum "ferrite-${{ matrix.target }}.tar.gz" | tee "SHA256-tarball-${{ matrix.target }}.txt"
      - name: SBOM cyclonedx
        run: cargo install --locked cargo-cyclonedx@0.5.9 && cargo cyclonedx --format json --target ${{ matrix.target }} --override-filename sbom-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ferrite*
            !target/${{ matrix.target }}/release/*.d
            !target/${{ matrix.target }}/release/*.pdb
            ferrite-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt
            SHA256-tarball-${{ matrix.target }}.txt
            crates/*/sbom-${{ matrix.target }}.json
            **/*.dmg
            **/*.msi
            **/*.deb
      - name: Reproducible verify
        shell: bash
        run: |
          echo "Reproducible: rebuilding with --locked and diffing"
          # Clean rebuild in the SAME directory: native static libs embed
          # absolute OUT_DIR paths, so any other directory compares
          # differently by construction. Artifacts are already uploaded.
          mkdir -p /tmp/verify-orig
          cp target/${{ matrix.target }}/release/ferrite target/${{ matrix.target }}/release/ferrite-pdf-renderer /tmp/verify-orig/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/*.d /tmp/verify-orig/ 2>/dev/null || true
          cargo clean
          cargo build --locked --release --target ${{ matrix.target }} --offline --features ferrite-vault/sqlcipher,ferrite-archive/sqlcipher
          shopt -s nullglob
          # Same collection as the checksum step, or the diff fails spuriously.
          files=(target/${{ matrix.target }}/release/ferrite*)
          for d in target/${{ matrix.target }}/release/bundle target/wix; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do files+=("$f"); done < <(find "$d" -type f | sort)
          done
          sha256sum "${files[@]}" | tee verify.txt
          # Mismatch warns instead of failing: the forensics below carry
          # the data for a post-hoc follow-up, and the release proceeds.
          if diff SHA256SUMS-${{ matrix.target }}.txt verify.txt; then
            echo "reproducible: rebuild matches"
          else
            echo "::warning::Rebuild differs from release build; release proceeds, determinism follow-up required"
            echo "--- dep-info diffs (order vs content distinguishes causes) ---"
            for pair in "ferrite.d" "ferrite-pdf-renderer.d"; do
              echo "== $pair =="; diff "/tmp/verify-orig/$pair" "target/${{ matrix.target }}/release/$pair" || true;
            done
            echo "--- binary strings deltas (first 30, sorted) ---"
            for bin in ferrite ferrite-pdf-renderer; do
              echo "== $bin =="
              diff <(strings "target/${{ matrix.target }}/release/$bin" | sort) <(strings "/tmp/verify-orig/$bin" | sort) | head -30 || true
            done
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/ferrite-*
            **/*.dmg
            **/*.msi
            **/*.deb
            **/SHA256SUMS-*.txt
            **/SHA256-tarball-*.txt
            **/sbom-*.json
          generate_release_notes: true
      - name: Update latest.json manifest
        run: |
          set -euo pipefail
          version=${GITHUB_REF#refs/tags/v}
          channel="stable"
          if [[ "$version" == *"-beta"* ]]; then channel="beta"; fi
          # Fetch existing manifest or create
          curl -sL https://ferrite.browser/latest.json -o latest.json || echo '{"stable":{"version":"0.0.0","rollout":100,"signature":"","targets":{},"severity":""},"beta":{"version":"0.0.0","rollout":100,"signature":"","targets":{},"severity":""}}' > latest.json
          # Fill this channel's per-target table from the built tarballs.
          # Every shipped triple must resolve or the manifest is incomplete
          # and the job fails here (never a partial table clients half-trust).
          python3 - "$version" "$channel" <<'EOF'
          import glob, hashlib, json, sys
          version, channel = sys.argv[1], sys.argv[2]
          with open("latest.json") as f:
              manifest = json.load(f)
          targets = {}
          for triple in ("x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu",
                         "x86_64-apple-darwin", "aarch64-apple-darwin"):
              hits = glob.glob(f"**/ferrite-{triple}.tar.gz", recursive=True)
              assert len(hits) == 1, f"expected one tarball for {triple}, got {hits}"
              with open(hits[0], "rb") as f:
                  sha = hashlib.sha256(f.read()).hexdigest()
              targets[triple] = {
                  "url": f"https://github.com/ZaudRehman/ferrite/releases/download/v{version}/ferrite-{triple}.tar.gz",
                  "sha256": sha,
                  "patch_url": None,
              }
          # Rollout stays at 1 (percent) on every release by deliberate
          # policy: new builds reach 1% of clients first, and a human
          # raises it in later manifest updates after crash-free hours.
          # Never raise this silently as part of a release.
          rel = manifest.get(channel, {})
          rel.update({"version": version, "rollout": 1, "targets": targets})
          rel.pop("signature", None)
          manifest[channel] = rel
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest[channel], indent=2))
          EOF
          cat latest.json
          # Commit to gh-pages via release workflow artifact
      - name: Sign latest.json manifest
        env:
          FERRITE_RELEASE_SIGNING_SEED: ${{ secrets.FERRITE_RELEASE_SIGNING_SEED }}
        run: |
          # Clients verify `signature` over the canonical message
          #   ferrite-release-v1\n<channel>\n<version>\n<rollout>(\n<triple>\n<sha256>\n<url>\n<patch_url>\n)*
          # with targets sorted by triple (see `release_signing_message` in
          # crates/ferrite-sync/src/updater.rs and its `signing_message_vector`
          # test; change both together). Clients refuse unsigned manifests.
          # Without the seed secret this step leaves the manifest unsigned
          # (clients fail closed). Provision FERRITE_RELEASE_SIGNING_SEED
          # (64 hex chars) to ship updates.
          if [ -z "$FERRITE_RELEASE_SIGNING_SEED" ]; then
            echo "No signing seed: manifest stays unsigned, clients will refuse it"
            exit 0
          fi
          pip install --quiet pynacl
          python3 - "$FERRITE_RELEASE_SIGNING_SEED" <<'EOF'
          import json, sys
          from nacl.signing import SigningKey
          seed = bytes.fromhex(sys.argv[1])
          sk = SigningKey(seed)
          print("release root pubkey:", sk.verify_key.encode().hex())
          with open("latest.json") as f:
              manifest = json.load(f)
          for channel in ("stable", "beta", "dev"):
              rel = manifest.get(channel)
              if not rel:
                  continue
              targets = {t: a for t, a in (rel.get("targets") or {}).items()
                         if a.get("url") and a.get("sha256")}
              if not targets:
                  continue
              parts = ["ferrite-release-v1", channel, rel.get("version", ""),
                       str(rel.get("rollout", 0))]
              for triple in sorted(targets):
                  a = targets[triple]
                  parts += [triple, a["sha256"], a["url"], a.get("patch_url") or ""]
              msg = "\n".join(parts) + "\n"
              rel["signature"] = sk.sign(msg.encode()).signature.hex()
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("manifest signed")
          EOF
          cat latest.json
      - name: Publish latest.json to site
        # Only the manifest goes to the site (clients fetch it by URL).
        # Release binaries stay on GitHub Releases; publishing the whole
        # working directory would push every artifact onto gh-pages.
        run: |
          set -euo pipefail
          mkdir -p site
          cp latest.json site/latest.json
      - name: Deploy manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: "chore(release): publish latest.json"
      - name: Update in-repo store manifests
        # Homebrew cask + Winget manifest track release artifacts. SHAs and
        # the MSI ProductCode cannot exist before the build, so this step
        # rewrites them from the just-built outputs and opens a PR. A missing
        # artifact fails the job loudly: never a silent placeholder.
        run: |
          set -euo pipefail
          version=${GITHUB_REF#refs/tags/v}
          arm_dmg=$(find . -name 'Ferrite-*aarch64-apple-darwin.dmg' | head -1)
          intel_dmg=$(find . -name 'Ferrite-*x86_64-apple-darwin.dmg' | head -1)
          msi=$(find . -name '*.msi' | head -1)
          test -n "$arm_dmg" || { echo "missing arm64 dmg"; exit 1; }
          test -n "$intel_dmg" || { echo "missing x64 dmg"; exit 1; }
          test -n "$msi" || { echo "missing msi"; exit 1; }
          arm_sha=$(sha256sum "$arm_dmg" | cut -d' ' -f1)
          intel_sha=$(sha256sum "$intel_dmg" | cut -d' ' -f1)
          msi_sha=$(sha256sum "$msi" | cut -d' ' -f1)
          msi_url="https://github.com/ZaudRehman/ferrite/releases/download/v$version/$(basename "$msi")"
          product_code="{FERRITE-BROWSER-0-1-0}"
          # The MSI ProductCode cannot exist before the build, so read it
          # from the just-built installer. msitools is mandatory here, not
          # best-effort: falling back to the placeholder GUID would ship a
          # Winget manifest that can never match an installed product.
          sudo apt-get install -y msitools
          product_code=$(msiinfo export "$msi" Property | grep -i "^ProductCode" | cut -f2 | tr -d '\r')
          test -n "$product_code" || { echo "could not read MSI ProductCode"; exit 1; }
          python3 - "$version" "$arm_sha" "$intel_sha" "$msi_sha" "$msi_url" "$product_code" <<'EOF'
          import re, sys
          version, arm_sha, intel_sha, msi_sha, msi_url, product_code = sys.argv[1:7]
          rb = "homebrew/Ferrite.rb"
          s = open(rb).read()
          s = re.sub(r'version "[^"]+"', f'version "{version}"', s, count=1)
          s = re.sub(r'sha256 arm:\s*"[^"]+"', f'sha256 arm:   "{arm_sha}"', s, count=1)
          s = re.sub(r'intel:\s*"[^"]+"', f'intel: "{intel_sha}"', s, count=1)
          open(rb, "w").write(s)
          y = "winget/Ferrite.Browser.yaml"
          s = open(y).read()
          s = re.sub(r"PackageVersion: .*", f"PackageVersion: {version}", s, count=1)
          s = re.sub(r"InstallerUrl: .*", f"InstallerUrl: {msi_url}", s, count=1)
          s = re.sub(r"InstallerSha256: .*", f"InstallerSha256: {msi_sha}", s, count=1)
          s = re.sub(r"ProductCode: .*", f"ProductCode: \"{product_code}\"", s, count=1)
          open(y, "w").write(s)
          print("store manifests rewritten")
          EOF
      - name: Store manifests PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): update store manifests"
          title: "chore(release): update store manifests"
          body: "Automated manifest refresh for this tag (Homebrew cask, Winget). SHAs computed from release artifacts."
          branch: "chore/release-manifests"
          add-paths: |
            homebrew/Ferrite.rb
            winget/Ferrite.Browser.yaml
