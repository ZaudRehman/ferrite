name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # WebKitGTK/wry sys libs plus perl for the vendored SQLCipher/OpenSSL
      # builds (see docs/SETUP.md).
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev perl pkg-config libssl-dev
      # pdfium native library for --all-features tests (they bind the
      # real engine; see crates/ferrite-archive/src/pdf.rs). Pinned by tag
      # AND sha256; a mismatch fails the job.
      - name: pdfium library (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfium" && cd "$RUNNER_TEMP/pdfium"
          # Binary must match the crate's bindings ceiling (0.9.x tops out
          # at pdfium_7881). A newer binary with older bindings corrupts
          # the heap instead of failing at load.
          curl -fsSL -o pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz
          echo "1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d  pdfium.tgz" | sha256sum -c -
          tar xzf pdfium.tgz
          # Locate, don't assume: the archive layout changes across
          # releases. Fail fast with a listing, not a cryptic DlOpen error.
          LIB="$(find "$RUNNER_TEMP/pdfium" -name libpdfium.so | head -n 1)"
          test -n "$LIB" || { echo "libpdfium.so not found after extract:"; find "$RUNNER_TEMP/pdfium" -maxdepth 3; exit 1; }
          echo "FERRITE_PDFIUM_PATH=$(dirname "$LIB")" >> $GITHUB_ENV
      - name: Rust fmt
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: SBOM
      # Pinned like the other generators. One file per manifest, so
      # collect by glob; fail loudly if that layout ever changes.
        run: cargo install --locked cargo-cyclonedx@0.5.9 && cargo cyclonedx --format json --override-filename sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: crates/*/sbom.json
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Go vet
        working-directory: relay
        run: go vet ./...
      - name: Go fmt
        working-directory: relay
        run: test -z "$(gofmt -l .)"
      - name: Go tests
        working-directory: relay
        run: go test ./...

  # Wayland/gtk compile gate: behaviorally untested (no display in
  # runners), but it must keep compiling or the fallback rots.
  wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev perl pkg-config libssl-dev
      - name: Wayland gtk path compiles
        run: cargo check -p ferrite-tabs --features gtk
      - name: Wayland gtk clippy
        run: cargo clippy -p ferrite-tabs --features gtk --all-targets -- -D warnings

  # Engine matrix drift gate: a bumped lockfile without a re-verified
  # matrix rediscovers gaps via production bugs.
  engine-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pinned versions match ENGINE.md
        shell: bash
        run: |
          set -euo pipefail
          check() { # check <crate> <expected-version>
            local got
            got=$(awk -v n="$1" 'BEGIN{name=""} /^\[\[package\]\]/{name=""} /^name = /{gsub(/"/,"",$3); name=$3} /^version = /{gsub(/"/,"",$3); if(name=="'"$1"'"){print $3; exit}}' Cargo.lock)
            [ "$got" = "$2" ] || { echo "ENGINE.md drift: $1 is $got in Cargo.lock, expected $2 (re-verify docs/ENGINE.md or pin back)"; exit 1; }
          }
          # Versions below mirror docs/ENGINE.md "Pinned versions". Update
          # both together on every bump.
          check wry "0.56.1"
          check winit "0.30.13"
          # have() instead of check(): these crates legitimately appear
          # twice in the lock (older copies ride along inside winit/wry),
          # so assert presence of the pinned direct version, not first-match.
          have() { # have <crate> <version>
            grep -A1 "^name = \"$1\"$" Cargo.lock | grep -q "^version = \"$2\"$"
          }
          have objc2 "0.6.4"
          have objc2-foundation "0.3.2"
          have objc2-app-kit "0.3.2"
          have raw-window-handle "0.6.2"
          grep -q 'wry | 0.56.1' docs/ENGINE.md || { echo "ENGINE.md wry row missing"; exit 1; }
          grep -q 'winit | 0.30.13' docs/ENGINE.md || { echo "ENGINE.md winit row missing"; exit 1; }
          grep -q 'objc2.*0.6.4' docs/ENGINE.md || { echo "ENGINE.md objc2 row missing"; exit 1; }
          grep -q 'raw-window-handle | 0.6.2' docs/ENGINE.md || { echo "ENGINE.md rwh row missing"; exit 1; }
          echo "engine matrix in sync"
