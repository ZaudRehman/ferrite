name: credits
on: [push, pull_request]
jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install license tools
        run: cargo install cargo-deny --locked
      - name: Install attribution tool
        # Pinned: the freshness diff consumes this output, so the generator
        # version is part of the contract. Bump together with a regen.
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Deny unlisted licenses
        run: cargo deny check licenses
      - name: Attribution snapshot is fresh
        # Compares the dependency list, not raw bytes: cargo-about embeds
        # absolute local paths, which differ on every machine. Dependency
        # changes still fail this check.
        run: |
          cargo about generate --format json -o /tmp/credits.json
          list() { jq -r '.licenses[] | .id as $l | .used_by[].crate | "\($l) \(.name) \(.version)"' "$1" | sort; }
          diff <(list /tmp/credits.json) <(list crates/ferrite-tabs/assets/credits.json)
          # The snapshot ships in the binary: scrub machine paths after
          # every regen; this fails loud if they leak back in.
          ! grep -E '"(source_path|path)":"([A-Za-z]:|/home/|/Users/)' crates/ferrite-tabs/assets/credits.json
