name: credits
on: [push, pull_request]
jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install license tools
        run: cargo install cargo-deny --locked
      - name: Install attribution tool
        run: cargo install cargo-about --features cli --locked
      - name: Deny unlisted licenses
        run: cargo deny check licenses
      - name: Attribution snapshot is fresh
        run: |
          cargo about generate --format json -o /tmp/credits.json
          diff /tmp/credits.json crates/ferrite-tabs/assets/credits.json
