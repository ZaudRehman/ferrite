[workspace]
resolver = "3"
members = [
    "crates/ferrite-shell",
    "crates/ferrite-browser",
    "crates/ferrite-tabs",
    "crates/ferrite-omnibox",
    "crates/ferrite-proxy",
    "crates/ferrite-privacy",
    "crates/ferrite-archive",
    "crates/ferrite-pdf-renderer",
    "crates/ferrite-vault",
    "crates/ferrite-credentials",
    "crates/ferrite-sync",
    "crates/ferrite-chrome",
]

[workspace.package]
version = "0.1.0"
# Project license (mirrored on the About page; change this one line if the
# project relicenses; members inherit it).
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
# Windowing & GUI stack: winit window plus wry webviews. Chrome is a
# bundled ferrite://chrome webview (see crates/ferrite-chrome); there is no
# retained-mode toolkit in the tree.
winit = "0.30"

# Error handling: typed errors in libraries, anyhow aggregation in the binary
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Content layer
# wry `devtools`: the launch layer opens the engine's own inspector
# (WebView2 DevTools / WebKit inspector): no CDP endpoint of our own,
# nothing listening on any port. Required in release too, not just debug.
wry = { version = "0.56", features = ["devtools"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
tokio = { version = "1.36", features = ["full"] }
url = "2.5"
http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
ferrite-tabs = { path = "crates/ferrite-tabs" }
ferrite-omnibox = { path = "crates/ferrite-omnibox" }
ferrite-proxy = { path = "crates/ferrite-proxy" }
ferrite-privacy = { path = "crates/ferrite-privacy" }
ferrite-archive = { path = "crates/ferrite-archive" }
ferrite-vault = { path = "crates/ferrite-vault" }
ferrite-credentials = { path = "crates/ferrite-credentials" }
ferrite-sync = { path = "crates/ferrite-sync" }
ferrite-chrome = { path = "crates/ferrite-chrome" }

# Network interception engine: raw tokio + httparse, no framework proxy.
httparse = "1.8"
crossbeam-channel = "0.5"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
sha2 = "0.11"
regex = "1.12"
once_cell = "1.21"
zstd = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
quinn = "0.11"
mdns-sd = "0.13"
rcgen = "0.13"
rustls-pki-types = "1.12"
bytes = "1.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` stays off: the binary's panic hook (crash log) runs
# during unwinding, so abort would silently lose crash reports.
