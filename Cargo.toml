[workspace]
resolver = "3"
members = [
    "crates/ferrite-shell",
    "crates/ferrite-browser",
    "crates/ferrite-tabs",
    "crates/ferrite-omnibox",
    "crates/ferrite-proxy",
    "crates/ferrite-privacy",
    "crates/ferrite-archive",
    "crates/ferrite-pdf-renderer",
    "crates/ferrite-vault",
    "crates/ferrite-credentials",
    "crates/ferrite-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
# Windowing & GUI stack (version matrix aligned with egui-wgpu 0.36 requirements)
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
wgpu = "30"
winit = "0.30"

# Error handling: typed errors in libraries, anyhow aggregation in the binary
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async bridge for synchronous GPU init (Painter::new / set_window are async)
pollster = "0.4"

# Content layer (Part 2)
wry = "0.56"
uuid = { version = "1.7", features = ["v4", "serde"] }
tokio = { version = "1.36", features = ["full"] }
url = "2.5"
http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
ferrite-tabs = { path = "crates/ferrite-tabs" }
ferrite-omnibox = { path = "crates/ferrite-omnibox" }
ferrite-proxy = { path = "crates/ferrite-proxy" }
ferrite-privacy = { path = "crates/ferrite-privacy" }
ferrite-archive = { path = "crates/ferrite-archive" }
ferrite-vault = { path = "crates/ferrite-vault" }
ferrite-credentials = { path = "crates/ferrite-credentials" }
ferrite-sync = { path = "crates/ferrite-sync" }

# Network interception engine (Part 4) — raw tokio + httparse (see CHECKSUM/PART4)
httparse = "1.8"
crossbeam-channel = "0.5"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
sha2 = "0.11"
regex = "1.12"
once_cell = "1.21"
zstd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
quinn = "0.11"
mdns-sd = "0.13"
rcgen = "0.13"
rustls-pki-types = "1.12"
bytes = "1.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# NOTE: `panic = "abort"` is deliberately NOT enabled. The shell installs a
# frame-level panic boundary (see ferrite_shell::shell) per ARCHITECTURE.md
# section 5.2, which requires unwinding to function.
