[package]
name = "ferrite-browser"
description = "The Ferrite sovereign browser binary."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

# Packaging metadata (cargo-bundle deb/dmg; cargo-wix reads its own wix/
# scaffolding). The bundle name uses the display spelling so macOS emits
# Ferrite.app, which the release workflow hard-codes downstream.
[package.metadata.bundle]
name = "Ferrite"
identifier = "io.ferrite.browser"
category = "Utility"

[dependencies]
ferrite-shell = { path = "../ferrite-shell" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Windows-only exe icon (build.rs no-ops on other targets).
[build-dependencies]
winres = "0.1"
