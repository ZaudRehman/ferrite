[package]
name = "ferrite-browser"
description = "The Ferrite sovereign browser binary."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

# Packaging metadata (cargo-bundle deb/dmg; cargo-wix reads its own wix/
# scaffolding). The bundle name uses the display spelling so macOS emits
# Ferrite.app, which the release workflow hard-codes downstream.
[package.metadata.bundle]
name = "Ferrite"
identifier = "io.ferrite.browser"
category = "Utility"

[dependencies]
ferrite-shell = { path = "../ferrite-shell" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# Console re-attach for the debug log path (see `src/main.rs`). Pinned with
# wry/ferrite-shell (0.61); do not bump alone, the string newtypes churn.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

# Windows-only exe icon (build.rs no-ops on other targets).
[build-dependencies]
winres = "0.1"
