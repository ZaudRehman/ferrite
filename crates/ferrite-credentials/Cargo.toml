[package]
name = "ferrite-credentials"
description = "Ferrite zero-knowledge password and autofill manager — credentials, TOTP, generator, breach, health, sync (Part 8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.7", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ring = "0.17"
argon2 = "0.5"
sha1 = "0.10"
totp-rs = { version = "5.6", features = ["otpauth"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
ferrite-vault.workspace = true
url.workspace = true
arboard = "3.6.1"
aes-gcm = "0.11.1"
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1.9"
