[package]
name = "ferrite-shell"
description = "Ferrite browser shell: winit window plus wry webviews. Chrome (tab strip, omnibox, status) is a bundled ferrite://chrome webview driven by ferrite-chrome state pushes; no retained GUI toolkit."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
winit.workspace = true
thiserror.workspace = true
tracing.workspace = true
ferrite-tabs.workspace = true
ferrite-omnibox.workspace = true
ferrite-proxy.workspace = true
ferrite-privacy.workspace = true
ferrite-archive.workspace = true
ferrite-vault.workspace = true
ferrite-chrome.workspace = true
ferrite-credentials.workspace = true
ferrite-sync.workspace = true
zeroize = "1.7"
serde_json.workspace = true
serde.workspace = true
rustls.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
x509-parser = "0.16"
sha2.workspace = true
ureq = "3.4"
rfd = "0.17.2"
base64 = "0.23"
rand = "0.8"
fs2 = "0.4"
arboard = "3.6.1"
sysinfo = "0.36"
png = "0.18"
wry.workspace = true
raw-window-handle = "0.6"
url.workspace = true

[target.'cfg(windows)'.dependencies]
# Pinned with wry (0.56 pins windows 0.61): 0.62 reworks the string newtypes
# (HSTRING/PCWSTR/PWSTR/Error no longer convert implicitly), which breaks our
# native dialog/share call sites AND splits types across the wry boundary.
# Revisit when wry moves; do not bump alone.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "ApplicationModel_DataTransfer",
    "Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Exact pins, not carets: macOS-only code compiles solely in the release
# workflow, so a silent minor bump here rots until release day (0.6.x API
# churn broke the share sheet once already). Bump deliberately with the
# ENGINE.md matrix and the Apple-target check in hand.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSURL", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSSharingService", "NSView", "NSWindow", "NSEvent", "NSResponder", "NSWorkspace"] }
