<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; script-src 'unsafe-inline'">
<title>Ferrite</title>
<style>/*__FERRITE_THEME__*/</style>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; background:var(--f-bg); color:var(--f-fg); font-family:var(--f-font-ui); overscroll-behavior:none; }
  #app{ display:flex; flex-direction:column; height:100dvh; }
  /* Top strip: domain + status only (no tab strip on mobile). */
  #topbar{ display:flex; align-items:center; gap:8px; padding:8px 12px env(safe-area-inset-right) 8px 12px; background:var(--f-surface-1); border-bottom:1px solid var(--f-border); min-height:48px; }
  #lock{ font-size:14px; color:var(--f-muted); }
  #disp{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  #disp .sub{ color:var(--f-muted); }
  #disp .dom{ color:var(--f-fg); font-weight:600; }
  #disp .path{ color:var(--f-muted); }
  #sh{ position:relative; border:1px solid var(--f-border); background:var(--f-surface-2); color:var(--f-fg); border-radius:8px; min-width:44px; min-height:44px; font-size:16px; }
  #shb{ position:absolute; top:2px; right:2px; background:var(--f-danger); color:#fff; border-radius:8px; font-size:10px; padding:0 4px; }
  #shb.zero{ display:none; }
  /* Content viewport is the webview below (shell positions content tabs
     under this chrome layer). This layer only draws chrome. */
  #stage{ flex:1; position:relative; min-height:0; }
  /* Bottom toolbar: thumb-reachable primary actions. */
  #toolbar{ display:flex; align-items:center; justify-content:space-around; gap:4px; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); background:var(--f-surface-1); border-top:1px solid var(--f-border); }
  #toolbar button{ flex:1; max-width:72px; min-height:48px; background:none; border:0; color:var(--f-fg); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px; border-radius:8px; }
  #toolbar button:active{ background:var(--f-surface-2); }
  #toolbar button .ic{ font-size:20px; line-height:1; }
  #toolbar button svg.ic{ width:22px; height:22px; }
  #lock svg.ic{ width:14px; height:14px; display:block; }
  #star svg.ic{ width:18px; height:18px; }
  #findbar button svg.ic{ width:16px; height:16px; }
  #findbar button.up svg.ic{ transform:rotate(180deg); }
  #tabcount{ position:relative; }
  #tabcount .n{ position:absolute; top:2px; right:8px; background:var(--f-accent); color:var(--f-bg); border-radius:8px; font-size:10px; padding:0 5px; font-weight:700; }
  /* Omnibox sheet: slides over content when focused. */
  #omnisheet{ display:none; position:absolute; inset:0; background:var(--f-bg); z-index:40; flex-direction:column; }
  #omnisheet.open{ display:flex; }
  #omnirow{ display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--f-border); }
  #omni{ flex:1; min-height:48px; font-size:16px; background:var(--f-surface-1); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; padding:8px 12px; }
  #omnicancel{ min-width:64px; min-height:48px; background:none; border:0; color:var(--f-accent); font-size:16px; }
  #ghost{ color:var(--f-muted); font-size:13px; padding:4px 14px; min-height:18px; }
  #sugs{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #sugs .sug{ display:flex; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--f-border); font-size:15px; min-height:52px; }
  #sugs .sug .k{ color:var(--f-muted); font-size:11px; text-transform:uppercase; }
  #sugs .sug .u{ color:var(--f-muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Tab switcher: full-screen card grid. */
  #switcher{ display:none; position:absolute; inset:0; background:var(--f-bg); z-index:30; flex-direction:column; }
  #switcher.open{ display:flex; }
  #swhead{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--f-border); }
  #swhead h2{ margin:0; font-size:17px; }
  #swhead button{ min-width:48px; min-height:44px; background:var(--f-surface-1); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; font-size:15px; }
  #swgrid{ flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; }
  .swcard{ background:var(--f-surface-1); border:1px solid var(--f-border); border-radius:10px; padding:10px; min-height:120px; display:flex; flex-direction:column; gap:6px; }
  .swcard.active{ border-color:var(--f-accent); }
  .swcard .t{ font-size:14px; font-weight:600; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .swcard .u{ font-size:11px; color:var(--f-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .swcard .row{ margin-top:auto; display:flex; gap:8px; }
  .swcard .row button{ flex:1; min-height:40px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; }
  /* Bottom sheet menu. */
  #sheet{ display:none; position:absolute; left:0; right:0; bottom:0; max-height:70%; overflow-y:auto; background:var(--f-surface-1); border-top:1px solid var(--f-border); border-radius:14px 14px 0 0; z-index:35; padding:8px 0 calc(12px + env(safe-area-inset-bottom)); }
  #sheet.open{ display:block; }
  #sheet button.m{ display:flex; width:100%; gap:12px; align-items:center; padding:14px 18px; background:none; border:0; color:var(--f-fg); font-size:16px; min-height:52px; text-align:left; }
  #sheet button.m:active{ background:var(--f-surface-2); }
  /* Toast, find bar, dialogs. */
  #toast{ display:none; position:absolute; left:12px; right:12px; bottom:76px; background:var(--f-surface-2); border:1px solid var(--f-border); border-radius:10px; padding:12px 14px; z-index:50; font-size:14px; }
  #toast.open{ display:flex; gap:10px; align-items:center; }
  #toast button{ margin-left:auto; min-height:40px; background:var(--f-accent); border:0; border-radius:8px; padding:8px 14px; font-size:14px; color:var(--f-bg); }
  #findbar{ display:none; position:absolute; top:0; left:0; right:0; background:var(--f-surface-1); border-bottom:1px solid var(--f-border); z-index:45; padding:8px 12px; gap:8px; align-items:center; }
  #findbar.open{ display:flex; }
  #findq{ flex:1; min-height:44px; font-size:16px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; padding:6px 10px; }
  #findbar button{ min-width:48px; min-height:44px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; }
  #shieldpop{ display:none; position:absolute; top:52px; right:8px; width:min(320px,90vw); background:var(--f-surface-1); border:1px solid var(--f-border); border-radius:10px; z-index:45; padding:12px 14px; font-size:14px; }
  #shieldpop.open{ display:block; }
  #shieldpop button{ min-height:44px; width:100%; margin-top:8px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; font-size:15px; }
  #zoompop{ display:none; position:absolute; bottom:76px; left:12px; right:12px; background:var(--f-surface-1); border:1px solid var(--f-border); border-radius:10px; z-index:45; padding:10px 14px; align-items:center; gap:12px; }
  #zoompop.open{ display:flex; }
  #zoompop button{ min-width:52px; min-height:48px; font-size:18px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; }
  /* Panel: single scrollable surface (tabs/history/bookmarks/downloads). */
  #panel{ display:none; position:absolute; inset:0; background:var(--f-bg); z-index:32; flex-direction:column; }
  #panel.open{ display:flex; }
  #paneltabs{ display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--f-border); overflow-x:auto; }
  #paneltabs button{ min-height:44px; padding:8px 14px; background:none; border:0; color:var(--f-muted); font-size:15px; white-space:nowrap; }
  #paneltabs button.on{ color:var(--f-fg); border-bottom:2px solid var(--f-accent); }
  #panelbody{ flex:1; overflow-y:auto; padding:6px 0 20px; }
  #panelbody .row{ display:flex; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--f-border); font-size:15px; min-height:52px; }
  #panelbody .row .u{ color:var(--f-muted); font-size:12px; }
  #panelbody .row button{ margin-left:auto; min-height:40px; padding:6px 12px; background:var(--f-surface-2); border:1px solid var(--f-border); color:var(--f-fg); border-radius:8px; }
  #infobar{ display:none; background:var(--f-warning); color:#000; padding:10px 14px; font-size:14px; z-index:20; }
  #infobar.open{ display:flex; gap:10px; align-items:center; }
  #infobar button{ margin-left:auto; min-height:40px; padding:6px 12px; border:1px solid #000; background:none; border-radius:8px; font-weight:700; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div id="app" role="application" aria-label="Ferrite browser">
  <div id="topbar">
    <span id="lock" aria-hidden="true"></span>
    <div id="disp" title="Tap address bar to edit"></div>
    <button id="star" title="Bookmark this page" aria-label="Bookmark this page" style="min-width:44px;min-height:44px;background:none;border:0;color:var(--f-fg);font-size:18px;">☆</button>
    <button id="sh" title="Privacy status" aria-label="Privacy status"><span id="shi"></span><span class="bdg zero" id="shb">0</span></button>
  </div>
  <div id="infobar" role="alert"></div>
  <div id="stage">
    <div id="findbar" role="search">
      <input id="findq" type="search" placeholder="Find in page" aria-label="Find in page">
      <button id="findprev" title="Previous" aria-label="Previous">↑</button>
      <button id="findnext" title="Next" aria-label="Next">↓</button>
      <button id="findx" title="Close (Escape)">✕</button>
    </div>
    <div id="shieldpop" role="dialog" aria-label="Privacy status"></div>
    <div id="zoompop" role="dialog" aria-label="Page zoom"></div>
    <div id="omnisheet" role="dialog" aria-label="Address and search">
      <div id="omnirow">
        <input id="omni" role="combobox" aria-expanded="false" aria-autocomplete="both" aria-label="Address and search" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off" autocapitalize="off">
        <button id="omnicancel">Cancel</button>
      </div>
      <div id="ghost" aria-hidden="true"></div>
      <div id="sugs" role="listbox"></div>
    </div>
    <div id="switcher" role="dialog" aria-label="Tabs">
      <div id="swhead"><h2>Tabs</h2><button id="swclose">Done</button></div>
      <div id="swgrid" role="tablist"></div>
    </div>
    <div id="panel" role="complementary" aria-label="Library">
      <div id="paneltabs" role="tablist">
        <button data-sec="tabs" role="tab">Tabs</button>
        <button data-sec="history" role="tab">History</button>
        <button data-sec="bookmarks" role="tab">Bookmarks</button>
        <button data-sec="downloads" role="tab">Downloads</button>
        <button data-sec="reading" role="tab">Reading</button>
      </div>
      <div id="panelbody"></div>
    </div>
    <div id="sheet" role="menu" aria-label="Menu"></div>
    <div id="toast" role="status"></div>
  </div>
  <div id="toolbar" role="toolbar" aria-label="Browser">
    <button id="back" aria-label="Back"><span class="ic">‹</span>Back</button>
    <button id="fwd" aria-label="Forward"><span class="ic">›</span>Fwd</button>
    <button id="rel" aria-label="Reload"><span class="ic">↻</span>Reload</button>
    <button id="tabcount" aria-label="Tabs"><span class="ic">▢</span>Tabs<span class="n" id="tabn">0</span></button>
    <button id="sharebtn" aria-label="Share"><span class="ic">⤴</span>Share</button>
    <button id="menu" aria-label="Menu"><span class="ic">☰</span>Menu</button>
  </div>
</div>
<div class="sr" aria-live="polite" id="sr-live"></div>

  // Weight-aware render: Regular default, Bold lit, Fill toggled-on.

  // Static toolbar glyphs (set once, after the kit above).

  setIc('tabcount','caret'); setIc('sharebtn','share'); setIc('menu','menu');
  function setIc(btn, name){ try{ var s=document.querySelector('#'+btn+' .ic'); if(s) s.innerHTML=icon(name); }catch(e){} }
  // Find-bar chevrons (previous points up via the .up rule above).
  document.getElementById('findprev').innerHTML=icon('caret'); document.getElementById('findprev').classList.add('up');
  document.getElementById('findnext').innerHTML=icon('caret');
  document.getElementById('findx').innerHTML=icon('x');

  // ---- state render (same contract as desktop: full replace per push) ----
  window.__ferriteChrome=function(s){
    S=s||{};

  };

  function renderTop(){
    var d=(S&&S.disp)||{sch:'',sub:'',dom:'',path:''};
    document.getElementById('disp').innerHTML='<span class="sub">'+esc(d.sch)+esc(d.sub)+'</span><span class="dom">'+esc(d.dom)+'</span><span class="path">'+esc(d.path)+'</span>';
    document.getElementById('lock').innerHTML=(S&&S.sec==='lock')?icon('lock'):(S&&S.sec==='info'?icon('info'):'');
    var b=document.getElementById('shb'), n=(S&&S.status&&S.status.blocked)||0;
    b.textContent=String(n); b.className=n?'bdg':'bdg zero';
    document.getElementById('shi').innerHTML=icon('shield');
  }
  function renderToolbar(){
    var tabs=(S&&S.tabs)||[];
    document.getElementById('tabn').textContent=String(tabs.length);
    // Star reflects the active tab (same toggle_star as desktop).
    document.getElementById('star').innerHTML=icon('star',(S&&S.starred)?'f':'r');
  }
  document.getElementById('star').addEventListener('click',function(){
    var tabs=(S&&S.tabs)||[], active=null;
    for(var i=0;i<tabs.length;i++){ if(tabs[i].active) active=tabs[i]; }
    if(active&&(active.url||active.title)) post({cmd:'toggle_star',url:active.url||'',title:active.title||active.url||''});
  });
  // ---- tabs (switcher grid; strip physics don't exist on phones) ----
  function renderTabs(){
    var g=document.getElementById('swgrid'); g.textContent='';
    ((S&&S.tabs)||[]).forEach(function(t){
      var c=document.createElement('div'); c.className='swcard'+(t.active?' active':''); c.setAttribute('role','tab'); c.setAttribute('aria-selected',t.active?'true':'false');
      var title=document.createElement('div'); title.className='t'; title.textContent=t.title||t.url||'New Tab'; c.appendChild(title);
      var u=document.createElement('div'); u.className='u'; u.textContent=t.url||''; c.appendChild(u);
      var row=document.createElement('div'); row.className='row';
      var open=document.createElement('button'); open.textContent='Open';
      open.onclick=(function(id){return function(){ post({cmd:'select_tab',id:id}); closeSwitcher(); };})(t.id);
      var shut=document.createElement('button'); shut.textContent='Close'; shut.setAttribute('aria-label','Close tab');
      shut.onclick=(function(id){return function(){ post({cmd:'close_tab',id:id}); };})(t.id);
      row.appendChild(open); row.appendChild(shut); c.appendChild(row);
      g.appendChild(c);
    });
    var add=document.createElement('div'); add.className='swcard';

    add.appendChild(nt); g.appendChild(add);
  }
  function openSwitcher(){ document.getElementById('switcher').classList.add('open'); renderTabs(); }
  function closeSwitcher(){ document.getElementById('switcher').classList.remove('open'); }
  // ---- omnibox sheet ----
  var entryText='', provId=null;
  function openOmni(focus){
    document.getElementById('omnisheet').classList.add('open');
    var o=document.getElementById('omni');
    if(S&&typeof S.omnibox_text==='string'&&document.activeElement!==o){ o.value=S.omnibox_text; entryText=o.value; }
    if(focus!==false){ try{ o.focus(); }catch(e){} }
    renderSugs();
  }
  function closeOmni(){ document.getElementById('omnisheet').classList.remove('open'); provId=null; }
  function submitText(fallback){
    var o=document.getElementById('omni');
    return (o.value||'').slice(0,1800)||fallback||'';
  }
  var omni=document.getElementById('omni');
  omni.addEventListener('input',function(){ post({cmd:'omnibox_input',text:submitText(null)}); renderSugs(); });

  });

  function renderSugs(){
    var box=document.getElementById('sugs'); box.textContent='';
    ((S&&S.suggestions)||[]).forEach(function(g,i){
      var r=document.createElement('div'); r.className='sug'; r.setAttribute('role','option'); r.id='sug-'+i;
      var main=document.createElement('div');
      var t=document.createElement('div'); t.textContent=g.title||g.url||''; main.appendChild(t);
      if(g.url){ var u=document.createElement('div'); u.className='u'; u.textContent=g.url; main.appendChild(u); }
      r.appendChild(main);
      if(g.kind){ var k=document.createElement('span'); k.className='k'; k.textContent=g.kind; r.appendChild(k); }
      r.onclick=(function(g){return function(){
        if(g.tab){ post({cmd:'select_tab',id:g.tab}); closeOmni(); return; }
        post({cmd:'omnibox_submit',text:g.title||g.url||'',url:g.url||null,provider:provId}); closeOmni();

  // ---- menu sheet (same menu_item ids as desktop) ----

  function openSheet(){

    [['−','zoom_out'],['Reset','zoom_reset'],['+','zoom_in']].forEach(function(z){
      var b=document.createElement('button'); b.textContent=z[0];
      b.onclick=(function(c){return function(){ post({cmd:c}); };})(z[1]);
      pop.appendChild(b);
    });
    var x=document.createElement('button'); x.innerHTML=icon('x'); x.setAttribute('aria-label','Close text size');
    x.onclick=function(){ zoomOpen=false; renderZoom(); };
    pop.appendChild(x);
  }
  // ---- infobar (crash/session offers) ----
  function renderInfo(){
    var bar=document.getElementById('infobar');
    var msg=null, cmd=null;
    if(S&&S.crash_offer){ msg='Ferrite closed unexpectedly.'; cmd='crash_restore'; }
    bar.classList.toggle('open',!!msg);
    if(!msg){ bar.textContent=''; return; }
    bar.textContent=''; var s=document.createElement('span'); s.textContent=msg; bar.appendChild(s);
    var b=document.createElement('button'); b.textContent='Restore';
    b.onclick=function(){ post({cmd:cmd}); };
    bar.appendChild(b);
    var d=document.createElement('button'); d.textContent='Dismiss';
    d.onclick=function(){ post({cmd:'crash_dismiss'}); };
    bar.appendChild(d);
  }
  // ---- panel (one scroll: tabs/history/bookmarks/downloads/reading) ----
  var panelSec='tabs';
  function renderPanel(){
    var open=S&&S.panel_open, body=document.getElementById('panelbody');
    document.getElementById('panel').classList.toggle('open',!!open);
    if(!open) return;
    var tabs=document.querySelectorAll('#paneltabs button');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on',tabs[i].getAttribute('data-sec')===panelSec);
    body.textContent='';
    if(panelSec==='tabs'){
      ((S&&S.tabs)||[]).forEach(function(t){
        body.appendChild(panelRow(t.title||t.url||'New Tab',t.url||'',function(){ post({cmd:'select_tab',id:t.id}); },'Open'));
      });
    } else if(panelSec==='history'){
      post({cmd:'panel_history',q:''});
    } else if(panelSec==='bookmarks'){
      // Bookmarks ride the shared panel push (same hook as desktop):
      // select the section and the shell pushes __ferritePanelBookmarks.
      post({cmd:'panel_section',id:'bookmarks'});
    } else if(panelSec==='downloads'){
      post({cmd:'downloads_recent'});
    } else if(panelSec==='reading'){
      post({cmd:'reading_list'});
    }
  }
  function panelRow(title,sub,fn,action){
    var r=document.createElement('div'); r.className='row';
    var m=document.createElement('div');
    var t=document.createElement('div'); t.textContent=title; m.appendChild(t);
    if(sub){ var u=document.createElement('div'); u.className='u'; u.textContent=sub; m.appendChild(u); }
    r.appendChild(m);
    var b=document.createElement('button'); b.textContent=action||'Open'; b.onclick=fn; r.appendChild(b);
    return r;
  }
  // Pushed lists land here (same hooks as desktop).
  window.__ferritePanelHistory=function(items){ if(panelSec!=='history')return; var body=document.getElementById('panelbody'); body.textContent=''; (items||[]).forEach(function(h){ body.appendChild(panelRow(h.title||h.url,h.url,function(){ post({cmd:'navigate',url:h.url}); },'Open')); }); };
  window.__ferritePanelBookmarks=function(items){ if(panelSec!=='bookmarks')return; var body=document.getElementById('panelbody'); body.textContent=''; (items||[]).forEach(function(b){ body.appendChild(panelRow(b.title||b.url,b.url,function(){ post({cmd:'navigate',url:b.url}); },'Open')); }); };
  window.__ferriteDownloadsRecent=function(items){ if(panelSec!=='downloads')return; var body=document.getElementById('panelbody'); body.textContent=''; (items||[]).forEach(function(d){
    var r=document.createElement('div'); r.className='row';
    var m=document.createElement('div'); var t=document.createElement('div'); t.textContent=d.filename||d.url; m.appendChild(t);
    if(d.url){ var u=document.createElement('div'); u.className='u'; u.textContent=d.url; m.appendChild(u); }
    r.appendChild(m);
    var open=document.createElement('button'); open.textContent='Open';
    open.onclick=(function(id){return function(){ post({cmd:'dl_bubble_open',id:id}); };})(d.id);
    r.appendChild(open);
    var st=String(d.state||'').toLowerCase();
    if(st.indexOf('fail')>=0||st.indexOf('interrupt')>=0||st.indexOf('cancel')>=0){
      var retry=document.createElement('button'); retry.textContent='Retry';
      retry.onclick=(function(id){return function(){ post({cmd:'dl_bubble_retry',id:id}); };})(d.id);
      r.appendChild(retry);
    }
    body.appendChild(r);
  }); };
  window.__ferritePanelReading=function(items){ if(panelSec!=='reading')return; var body=document.getElementById('panelbody'); body.textContent=''; (items||[]).forEach(function(r){ body.appendChild(panelRow(r.title||r.url,r.url,function(){ post({cmd:'navigate',url:r.url}); },'Open')); }); };
  var ptabs=document.querySelectorAll('#paneltabs button');
  for(var pi=0;pi<ptabs.length;pi++){ (function(b){ b.addEventListener('click',function(){ panelSec=b.getAttribute('data-sec'); renderPanel(); }); })(ptabs[pi]); }
  // ---- permission requests (same broker as desktop: allow once, //
  // always, or dismiss into the quiet backoff; never auto-grant) ----
  function renderPerm(){
    var old=document.getElementById('permpop');
    if(old) old.parentNode.removeChild(old);
    var reqs=(S&&S.perm)||[];
    if(!reqs.length) return;
    var pop=document.createElement('div'); pop.id='permpop'; pop.setAttribute('role','alert');
    pop.style.cssText='position:absolute;top:52px;left:8px;right:8px;background:var(--f-surface-1);border:1px solid var(--f-border);border-radius:10px;z-index:46;padding:12px 14px;font-size:14px;';
    reqs.slice(0,3).forEach(function(r){
      var d=document.createElement('div'); d.textContent=(r.label||r.kind||'Permission')+' · '+(r.origin||'');
      pop.appendChild(d);
      var row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;margin:8px 0;';
      [['Once',false],['Always',true]].forEach(function(a){
        var b=document.createElement('button'); b.textContent=a[0]; b.style.cssText='flex:1;min-height:44px;background:var(--f-surface-2);border:1px solid var(--f-border);color:var(--f-fg);border-radius:8px;';
        b.onclick=(function(rr,al){return function(){ pop.parentNode.removeChild(pop); post({cmd:'perm_decide',origin:rr.origin,kind:rr.kind,always:al}); };})(r,a[1]);
        row.appendChild(b);
      });
      var n=document.createElement('button'); n.textContent='Not now'; n.style.cssText='flex:1;min-height:44px;background:none;border:1px solid var(--f-border);color:var(--f-fg);border-radius:8px;';
      n.onclick=function(){ if(pop.parentNode)pop.parentNode.removeChild(pop); };
      row.appendChild(n);
      pop.appendChild(row);
    });
    document.getElementById('stage').appendChild(pop);
  }
  // ---- toolbar wiring ----
  document.getElementById('back').addEventListener('click',function(){ post({cmd:'go_back',steps:1}); });
  document.getElementById('fwd').addEventListener('click',function(){ post({cmd:'go_forward',steps:1}); });
  document.getElementById('rel').addEventListener('click',function(){ post({cmd:'reload'}); });
  document.getElementById('tabcount').addEventListener('click',function(){ openSwitcher(); });
  document.getElementById('sharebtn').addEventListener('click',function(){ post({cmd:'share'}); });
  document.getElementById('menu').addEventListener('click',function(){ openSheet(); });
  document.getElementById('swclose').addEventListener('click',function(){ closeSwitcher(); post({cmd:'focus_content'}); });
  // Dismiss overlays on background tap of the stage (panels, not content).
  document.getElementById('stage').addEventListener('click',function(e){
    if(e.target===this){ closeSheet(); document.getElementById('shieldpop').classList.remove('open'); }
  });
  // Bootstraps from the shell push, exactly like desktop.
  post({cmd:'request_state'});
})();
</script>
</body>
</html>
