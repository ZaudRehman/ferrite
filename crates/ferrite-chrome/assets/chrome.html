<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Bundled chrome only. No remote URLs, no external fetches, ever.
     Colors and radii come from CSS vars: the factory theme string fills
     the shared theme marker at serve time, pack switches replace the
     pk style element, and each push sets the accent var.
     The template itself names no palette. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrite</title>
<style>/*__FERRITE_THEME__*/</style>
<style id="pk"></style>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{background:var(--f-bg);color:var(--f-fg);font-family:var(--f-font-ui);font-size:13px;}
  #tabbar{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;background:var(--f-bg);border-bottom:1px solid var(--f-border);user-select:none;}
  #tabs{display:flex;gap:2px;flex:1;overflow-x:auto;overflow-y:hidden;}
  .tab{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:76px;max-width:190px;padding:5px 6px 5px 10px;background:transparent;border:1px solid transparent;border-radius:var(--pk-tab-radius,2px);cursor:pointer;white-space:nowrap;color:var(--f-fg);transition:transform .18s cubic-bezier(.2,.9,.25,1.15),opacity .15s ease-out,background .12s ease-out;}
  .tab:hover{background:var(--f-surface-2);}
  .tab.active{background:var(--f-surface-1);border-color:var(--f-border);box-shadow:inset 0 2px 0 var(--f-accent);}
  .tab .t{overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.35;}
  .tab .x{border:none;background:transparent;color:var(--f-faint);cursor:pointer;border-radius:var(--pk-tab-radius,2px);padding:0 4px;font-size:12px;min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;}
  .tab:hover .x,.tab.active .x,.tab:focus-within .x{opacity:1;}
  .tab .x:hover{color:var(--f-fg);background:var(--f-surface-2);}
  .tab .ind{font-size:11px;color:var(--f-faint);display:flex;}
  /* Private-tab marker: warning-tinted dot plus a hairline underline on
     the tab, driven by the pushed `t.private` flag (never inferred here).
     Distinct from the incognito-window treatment on purpose: a private tab
     inside user mode is a different promise than an incognito window. */
  .tab .pdot{width:7px;height:7px;border-radius:50%;background:var(--f-warning);flex:none;align-self:center;}
  .tab.priv{box-shadow:inset 0 -2px 0 var(--f-warning);}
  .tab.priv.active{box-shadow:inset 0 2px 0 var(--f-accent),inset 0 -2px 0 var(--f-warning);}
  /* Active-tab-is-private treatment on the toolbar entry: warning tint,
     never the full incognito lit style (that one means the whole window). */
  #incogbtn.priv{color:var(--f-warning);}
  .tab .spin{display:inline-block;width:10px;height:10px;border:1.5px solid var(--f-border);border-top-color:var(--f-accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .tab .av{width:18px;height:18px;border-radius:50%;background:var(--f-surface-2);color:var(--f-muted);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .tab .fav{width:18px;height:18px;border-radius:4px;flex:none;}
  .tab.pinned{flex:none;width:42px;min-width:42px;max-width:42px;padding-left:0;padding-right:0;justify-content:center;}
  .tab.pinned .t,.tab.pinned .x{display:none;}
  .tab.fresh{animation:tabin .15s ease-out;}
  @keyframes tabin{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
  .tab.closing{transform:scale(.92);opacity:0;transition:transform .16s ease-out,opacity .16s ease-out;overflow:hidden;pointer-events:none;}
  .tab.dragging{transform:scale(1.03);box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.95;z-index:5;transition:none;}
  .tab.settle{transition:transform .18s cubic-bezier(.2,.9,.25,1.15),opacity .15s ease-out,background .12s ease-out;}
  .tab.gap{box-shadow:inset 2px 0 0 var(--f-accent);}
  /* Multi-select: accent outline on every selected chip. Selection is
     client state (sel), pruned against each push, cleared on plain click,
     Esc, and strip background click. */
  .tab.sel{box-shadow:inset 0 0 0 1.5px var(--f-accent);}
  .tab.sel.active{box-shadow:inset 0 2px 0 var(--f-accent),inset 0 0 0 1.5px var(--f-accent);}
  .tab.sel.ingroup{box-shadow:inset 2px 0 0 var(--gg,#9AA0A6),inset 0 0 0 1.5px var(--f-accent);}
  /* Vertical tab rail: the strip docks left at VTAB_W_PX (shell geometry
     matches this width in content_rect). Tabs stack full-width, groups
     flow inline, toolbar/bookbar shift right. Drag math follows the
     captured axis (see vtab()/axPos). */
  body.vtab #tabbar{position:fixed;left:0;top:0;bottom:0;width:232px;height:auto;flex-direction:column;align-items:stretch;padding:8px 6px;border-bottom:none;border-right:1px solid var(--f-border);z-index:40;}
  body.vtab #tabbar>span:first-child{padding:2px 4px 8px;}
  body.vtab #tabs{flex-direction:column;overflow-x:hidden;overflow-y:auto;flex:1;}
  body.vtab .tab,body.vtab .ghead{max-width:none;}
  body.vtab .tab.pinned{width:auto;min-width:0;max-width:none;}
  body.vtab .tab.gap{box-shadow:inset 0 2px 0 var(--f-accent);}
  body.vtab #tablist,body.vtab #newtab{margin-top:4px;width:100%;}
  body.vtab #tablist{margin-top:auto;}
  body.vtab #omnibar,body.vtab #bookbar{margin-left:232px;}
  /* Group headers: inline chips where membership changes, color-coded by
     the pushed group color. Members of a collapsed group stay in the DOM
     (drag indices address `data-idx`, never visible position) but hide. */
  .ghead{display:flex;align-items:center;gap:6px;flex:none;max-width:170px;padding:5px 8px;background:color-mix(in srgb,var(--gc,#9AA0A6) 16%,transparent);border:1px solid color-mix(in srgb,var(--gc,#9AA0A6) 55%,transparent);border-radius:var(--pk-tab-radius,2px);cursor:pointer;white-space:nowrap;color:var(--f-fg);}
  .ghead:hover{background:color-mix(in srgb,var(--gc,#9AA0A6) 28%,transparent);}
  .ghead .dot{width:9px;height:9px;border-radius:50%;background:var(--gc,#9AA0A6);flex:none;}
  .ghead .gn{overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;}
  .ghead .gc{font-size:11px;color:var(--f-muted);flex:none;}
  .ghead .car{color:var(--f-faint);font-size:10px;flex:none;}
  .ghead.dragging{transform:scale(1.03);box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.95;z-index:5;transition:none;}
  .tab.ghide{display:none;}
  .tab.ingroup{box-shadow:inset 2px 0 0 var(--gg,#9AA0A6);}
  .tab.ingroup.active{box-shadow:inset 0 2px 0 var(--f-accent),inset 2px 0 0 var(--gg,#9AA0A6);}
  /* Workspace switcher: tabbar button. Rows and forms are shell-hosted
     on the overlay (3c-6); the button carries only its label. */
  #wsbtn{border:1px solid transparent;background:transparent;color:var(--f-muted);border-radius:var(--pk-tab-radius,2px);padding:2px 7px;cursor:pointer;flex:none;font-size:12px;font-weight:700;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #wsbtn:hover{color:var(--f-fg);border-color:var(--f-border);}
  #wsbtn.on{color:var(--f-accent);border-color:var(--f-border);}
  /* Profile avatar: initial in a circle. */
  #profbtn{border:1px solid var(--f-border);background:var(--f-surface-2);color:var(--f-fg);border-radius:50%;width:26px;height:26px;cursor:pointer;flex:none;font-size:12px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;}
  #profbtn:hover{border-color:var(--f-accent);color:var(--f-accent);}
  /* Scope chip: shows while `@tabs`/`@bookmarks`/`@history` filters the
     dropdown (server-driven, never inferred). Click focuses the bar;
     deleting the prefix exits the scope. Hidden through its inline style
     like every other toolbar toggle (see the note above #star). */
  #scopechip{flex:none;font-size:11px;font-weight:700;color:var(--f-accent);border:1px solid var(--f-accent);border-radius:20px;padding:2px 8px;cursor:pointer;white-space:nowrap;}
  #newtab{border:1px solid var(--f-border);background:transparent;color:var(--f-fg);border-radius:var(--pk-tab-radius,2px);font-size:15px;padding:2px 9px;cursor:pointer;flex:none;}
  #newtab:hover{border-color:var(--f-accent);color:var(--f-accent);}
  #tablist{border:1px solid transparent;background:transparent;color:var(--f-faint);border-radius:var(--pk-tab-radius,2px);padding:2px 7px;cursor:pointer;flex:none;}
  #tablist:hover{color:var(--f-fg);border-color:var(--f-border);}
  #tablist svg.ic{width:13px;height:13px;}
  #bookbar{display:flex;align-items:center;gap:2px;height:0;overflow:hidden;background:var(--f-bg);border-bottom:1px solid transparent;opacity:0;transform:translateY(-6px);transition:opacity .15s ease-out,transform .15s ease-out;visibility:hidden;}
  #bookbar.open{height:30px;border-bottom-color:var(--f-border);opacity:1;transform:none;visibility:visible;}
  #baritems{display:flex;gap:2px;flex:1;overflow:hidden;align-items:center;height:30px;padding:0 8px;}
  .bitem{display:flex;align-items:center;gap:6px;max-width:170px;padding:3px 8px;border-radius:var(--pk-tab-radius,2px);cursor:pointer;white-space:nowrap;color:var(--f-fg);font-size:12px;background:transparent;border:none;font:inherit;flex:none;}
  .bitem:hover{background:var(--f-surface-2);}
  .bitem .t{overflow:hidden;text-overflow:ellipsis;}
  .bitem .av{width:16px;height:16px;border-radius:50%;background:var(--f-surface-2);color:var(--f-muted);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .bitem svg.ic{width:14px;height:14px;flex:none;}
  #barover{border:1px solid transparent;background:transparent;color:var(--f-faint);border-radius:var(--pk-tab-radius,2px);padding:0 7px;cursor:pointer;flex:none;font-size:13px;}
  #barover:hover{color:var(--f-fg);border-color:var(--f-border);}
  #omnibar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px;background:var(--f-surface-1);border-bottom:1px solid var(--f-border);}
  .nbtn{border:none;background:transparent;color:var(--f-muted);font-size:15px;border-radius:var(--pk-tab-radius,2px);padding:5px 8px;cursor:pointer;}
  .nbtn:hover:not(:disabled){background:var(--f-surface-2);color:var(--f-fg);}
  .nbtn:disabled{opacity:0.3;cursor:default;}
  #pill{flex:1;display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;background:var(--f-surface-2);border:1px solid var(--f-border);border-radius:var(--pk-pill-radius,16px);padding:0 12px;height:32px;position:relative;}
  #pill:focus-within{border-color:var(--f-accent);}
  .shbtn{position:relative;border:none;background:transparent;color:var(--f-fg);cursor:pointer;display:flex;align-items:center;padding:3px;border-radius:var(--pk-tab-radius,2px);}
  .shbtn:hover{background:var(--f-surface-1);}
  .shbtn svg.ic{width:15px;height:15px;}
  .shbtn.lit{color:var(--f-accent);}
  .shbtn .bdg{position:absolute;top:-5px;right:-8px;background:var(--f-accent);color:var(--f-bg);font-size:9px;font-weight:700;border-radius:999px;padding:0 4px;line-height:1.6;min-width:8px;text-align:center;}
  .shbtn .bdg.zero{opacity:.4;}
  .shbtn .bdg.bump{animation:bump .18s ease-out;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.4);}100%{transform:scale(1);}}
  .shbtn .dot{position:absolute;bottom:0;right:0;width:7px;height:7px;border-radius:50%;background:#3ddc84;border:1px solid var(--f-bg);}
  .shbtn .dot.down{background:var(--f-danger);}
  /* Controls whose visibility the script owns are hidden through the inline
     `display:none` in the served markup, never through a stylesheet rule: the
     script shows them by clearing that inline declaration, and a cleared
     inline falls back to the rule — so a `display:none` here makes the
     control permanently unreachable. That is exactly what happened to #star,
     #readbtn, #transbtn, #clr, #scopechip, #barover and #psearch. `none`
     stays the only hidden value because the roving-arrow filter reads
     `style.display`. `clear_to_show_controls_are_never_stylesheet_hidden` in
     tokens.rs derives the rule from the script itself and guards every target. */
  #star{border:none;background:transparent;color:var(--f-faint);cursor:pointer;padding:3px;border-radius:var(--pk-tab-radius,2px);}
  #star.on{color:var(--f-accent);}
  #star svg.ic{width:15px;height:15px;}
  #star.bump{animation:bump .25s ease-out;}
  #readbtn{border:none;background:transparent;color:var(--f-faint);cursor:pointer;padding:3px;border-radius:var(--pk-tab-radius,2px);}
  #readbtn:hover{color:var(--f-fg);background:var(--f-surface-2);}
  #readbtn svg.ic{width:15px;height:15px;}
  /* Translate offer: text chip (no icon in the kit; zoom sets the text
     precedent). Shows only when the pushed offer says the page language
     differs from the target. */
  #transbtn{border:none;background:transparent;color:var(--f-faint);cursor:pointer;padding:3px 6px;font-size:12px;font-weight:700;font-family:inherit;border-radius:var(--pk-tab-radius,2px);}
  #transbtn:hover{color:var(--f-accent);background:var(--f-surface-2);}
  #omni{flex:1;background:transparent;border:none;outline:none;color:var(--f-fg);font:inherit;min-width:0;}
  #omni::placeholder{color:var(--f-faint);}
  #disp{flex:1;display:flex;align-items:baseline;gap:0;overflow:hidden;white-space:nowrap;cursor:text;font-size:13px;min-width:0;}
  #disp .sch,#disp .sub,#disp .pth{color:var(--f-faint);}
  #disp .dom{color:var(--f-fg);font-weight:600;}
  #disp .ph{color:var(--f-faint);}
  #clr{border:none;background:transparent;color:var(--f-faint);cursor:pointer;font-size:14px;border-radius:var(--pk-tab-radius,2px);padding:0 6px;}
  #clr:hover{color:var(--f-fg);background:var(--f-surface-2);}
  button{touch-action:manipulation;}
  .nbtn,.cbtn{min-width:32px;min-height:32px;}
  @media (pointer:coarse){.nbtn,.cbtn{min-width:40px;min-height:40px;}.tab .x{opacity:1;}}
  #ghost{position:absolute;top:0;bottom:0;display:flex;align-items:center;pointer-events:none;font:inherit;font-size:13px;white-space:pre;overflow:hidden;z-index:1;}
  #ghost .g-in{color:transparent;}
  #ghost .g-out{color:var(--f-faint);}
  #sugs{position:absolute;top:36px;left:0;right:0;background:var(--f-surface-1);border:1px solid var(--f-border);border-radius:var(--pk-pop-radius,4px);backdrop-filter:blur(var(--pk-pop-blur,0px));z-index:10;display:none;overflow:hidden;animation:drop .15s ease-out;}
  @keyframes drop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  #sugs .s{padding:7px 12px;cursor:pointer;overflow:hidden;white-space:nowrap;display:flex;gap:8px;align-items:center;}
  #sugs .s.hl,#sugs .s:hover{background:var(--f-surface-2);}
  #sugs .s .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #sugs .s .u{color:var(--f-faint);font-size:12px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #sugs .s .k{color:var(--f-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;flex:none;}
  #sugs .av{width:18px;height:18px;border-radius:50%;background:var(--f-surface-2);color:var(--f-muted);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  #sugs .sugx{display:none;border:none;background:transparent;color:var(--f-faint);font-size:14px;line-height:1;border-radius:var(--pk-ctl-radius,6px);padding:2px 6px;cursor:pointer;flex:none;}
  #sugs .s:hover .sugx,#sugs .s:focus-within .sugx{display:block;}
  #sugs .sugx:hover,#sugs .sugx:focus-visible{color:var(--f-fg);background:var(--f-surface-2);}
  #eng{background:transparent;border:1px solid var(--f-border);color:var(--f-muted);border-radius:var(--pk-tab-radius,2px);font:inherit;font-size:12px;padding:3px 4px;max-width:110px;}
  .cbtn{border:none;background:transparent;color:var(--f-faint);font-size:15px;border-radius:var(--pk-tab-radius,2px);padding:5px 7px;cursor:pointer;position:relative;}
  .cbtn:hover,.cbtn.on{color:var(--f-fg);background:var(--f-surface-2);}
  .cbtn.accent{color:var(--f-accent);}
  #zoom{font-size:12px;font-weight:700;}
  #perm.attn{animation:bump .25s ease-out;}
  @media (max-width:760px){#pin,#devtools,#eng{display:none;}}
  /* Status strip: the last 26px of the window, inside the content inset the
     shell reserves (STATUS_H_PX). border-box so the 1px rule and 26px height
     agree with the shell's arithmetic instead of adding to it. */
  #status{box-sizing:border-box;display:flex;gap:14px;align-items:center;height:26px;padding:0 12px;background:var(--f-bg);border-top:1px solid var(--f-border);font-size:12px;color:var(--f-faint);position:fixed;bottom:0;left:0;right:0;}
  #status .num{font-family:var(--f-font-mono);font-variant-numeric:tabular-nums;}
  #status .hover{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;}
  #status .hover .sch,#status .hover .sub,#status .hover .pth{color:var(--f-faint);}
  #status .hover .dom{color:var(--f-fg);font-weight:600;}
  #status .bad{color:var(--f-danger);}
  /* Load bar: pinned to the last 2px of the chrome band (the content inset
     starts right below it), never in flow, so opening the infobar slides it
     down instead of leaving the bar under a covered strip. top is set from
     #infobar's measured bottom in positionLoadbar(). */
  #loadbar{position:fixed;left:0;right:0;height:2px;background:transparent;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;}
  #loadbar.on{opacity:1;}
  #loadbar i{position:absolute;top:0;bottom:0;left:0;width:30%;background:var(--f-accent);animation:ld 1.1s ease-in-out infinite;}
  @keyframes ld{0%{transform:translateX(-100%);}100%{transform:translateX(340%);}}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--f-accent);outline-offset:1px;}
  svg.ic{display:block;flex:none;fill:currentColor;}
  .nbtn svg.ic{width:16px;height:16px;}
  .cbtn svg.ic{width:16px;height:16px;margin:auto;}
  .tab .ind svg.ic{width:11px;height:11px;}
  .tab .x svg.ic{width:11px;height:11px;}
  #sec svg.ic{width:14px;height:14px;}
  #clr svg.ic{width:12px;height:12px;}
  #newtab svg.ic{width:14px;height:14px;}
  #dl{position:relative;}
  #dl svg.ic{width:16px;height:16px;}
  #dl svg.ring{width:16px;height:16px;transform:rotate(-90deg);}
  #dl .flash{color:var(--f-accent);}
  #dl.bump{animation:bump .25s ease-out;}
  #dl.err{color:var(--f-danger);}
  /* Tooltip primitive: one shared #ferrite-tip for every chrome surface
     (toolbar, tab strip, bookmarks bar). Simple text by default; .rich is
     the tab hover preview card (full title + URL). Single hairline border,
     no shadow, same restrained surface language as the rest of chrome. */
  #ferrite-tip{position:fixed;z-index:50;display:none;max-width:320px;background:var(--f-surface-1);border:1px solid var(--f-border);border-radius:var(--pk-tab-radius,2px);padding:6px 9px;font-size:12px;line-height:1.5;color:var(--f-fg);pointer-events:none;overflow-wrap:anywhere;}
  #ferrite-tip.show{display:block;}
  #ferrite-tip.rich{pointer-events:auto;min-width:200px;}
  #ferrite-tip .tt{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;}
  #ferrite-tip .uu{color:var(--f-faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;}
  #ferrite-tip .mm{display:flex;align-items:center;gap:6px;color:var(--f-faint);font-size:12px;white-space:nowrap;max-width:300px;}
  #ferrite-tip .mm svg.ic{width:12px;height:12px;}
  #ferrite-tip .frow{display:flex;gap:8px;align-items:center;}
  #ferrite-tip .ftav{width:28px;height:28px;border-radius:6px;flex:none;}
  @media (prefers-reduced-motion:reduce){.tab .spin,#loadbar i{animation:none!important;}#loadbar i{width:100%;left:0;transform:none;}#loadbar{transition:none;}.tab.fresh,.tab.closing,.tab.settle,#sugs,.shbtn .bdg.bump,#star.bump,#dl.bump,.tab.dragging{animation:none!important;transition:none!important;transform:none!important;}#infobar{transition:none!important;}#perm.attn{animation:none!important;}.tab.closing{display:none;}}
  #content-note{padding:40px;text-align:center;color:var(--f-border);}
  /* Side panel: toolbar toggle, drag rail, three sections. Mono avatars
     carry over from tabs/bar; row .act buttons are text, not icons. */
  #panelbtn.on{color:var(--f-accent);background:var(--f-surface-2);}
  #incogbtn.on{color:var(--f-accent);background:var(--f-surface-2);}
  #sidewrap{position:fixed;right:0;bottom:26px;display:none;background:var(--f-surface-1);border-left:1px solid var(--f-border);z-index:5;}
  #sidewrap.open{display:flex;}
  #pgrip{width:5px;cursor:ew-resize;flex:none;}
  #pgrip:hover{background:var(--f-accent);}
  #rail{display:flex;flex-direction:column;gap:2px;padding:8px 4px;border-right:1px solid var(--f-border);flex:none;}
  #rail button{border:none;background:transparent;color:var(--f-faint);border-radius:var(--pk-tab-radius,2px);padding:7px;cursor:pointer;}
  #rail button:hover{color:var(--f-fg);background:var(--f-surface-2);}
  #rail button.on{color:var(--f-accent);background:var(--f-surface-2);}
  #rail svg.ic{width:17px;height:17px;margin:auto;}
  #panel{flex:1;display:flex;flex-direction:column;min-width:0;}
  #phead{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 12px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--f-muted);}
  #phead .sp{flex:1;}
  #phead button{border:none;background:transparent;color:var(--f-faint);border-radius:var(--pk-tab-radius,2px);padding:4px;cursor:pointer;}
  #phead button:hover{color:var(--f-fg);background:var(--f-surface-2);}
  #phead button svg.ic{width:14px;height:14px;}
  #psearch{padding:0 12px 8px;}
  #psearch input{width:100%;box-sizing:border-box;background:var(--f-surface-2);border:1px solid var(--f-border);color:var(--f-fg);border-radius:var(--pk-tab-radius,2px);padding:6px 8px;font:inherit;font-size:12px;}
  #plist{flex:1;overflow-y:auto;padding:0 6px 12px;}
  .prow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--pk-tab-radius,2px);cursor:pointer;}
  .prow:hover{background:var(--f-surface-2);}
  .prow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
  .prow .u{color:var(--f-faint);font-size:11px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;}
  .prow .av{width:18px;height:18px;border-radius:50%;background:var(--f-surface-2);color:var(--f-muted);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .prow svg.ic{width:15px;height:15px;flex:none;color:var(--f-muted);}
  .prow.read .t{color:var(--f-faint);text-decoration:line-through;}
  .prow .act{border:none;background:transparent;color:var(--f-faint);border-radius:var(--pk-tab-radius,2px);padding:2px 5px;cursor:pointer;flex:none;font-size:12px;font-family:inherit;}
  .prow .act:hover{color:var(--f-fg);background:var(--f-surface-1);}
  .prow .act.done{color:var(--f-accent);}
  .pempty{padding:24px 12px;text-align:center;color:var(--f-faint);font-size:12px;}

     accent reserved for the Restore button; role=status never steals focus. */
  #infobar{display:flex;align-items:center;max-height:0;overflow:hidden;background:var(--f-surface-1);border-bottom:1px solid transparent;transition:max-height .18s ease-out;font-size:12px;}
  #infobar.open{max-height:40px;border-bottom-color:var(--f-border);}
  #infobar .in{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;width:100%;box-sizing:border-box;}
  #infobar svg.ic{width:15px;height:15px;color:var(--f-muted);flex:none;}
  #infobar .msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #infobar button{border:1px solid var(--f-border);background:transparent;color:var(--f-fg);border-radius:var(--pk-tab-radius,2px);padding:4px 12px;cursor:pointer;font:inherit;font-size:12px;flex:none;}
  #infobar button:hover{background:var(--f-surface-2);}
  #infobar button.primary{background:var(--f-accent);border-color:transparent;color:var(--f-bg);font-weight:700;}
